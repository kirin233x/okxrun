[project]
name = "okxrun"
version = "1.0.0"
description = "Live execution and portal for the R9 momentum strategy"
requires-python = ">=3.11,<3.14"
# Deliberately light: the box that holds the trading keys installs only what
# the executor and the portal need. The research backtests keep their own
# heavier project in research/pyproject.toml.
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
portal = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools]
packages = ["live", "strategy", "portal"]
